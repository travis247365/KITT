name: KITT
options:
  bundleIdPrefix: com.tpcl
  deploymentTarget:
    iOS: "26.0"
# One version for every app (the hub's package.json carries the same number): bump both together, see CHANGELOG.md.
settings:
  base:
    MARKETING_VERSION: "0.6.5"
    CURRENT_PROJECT_VERSION: "8"
packages:
  KITTKit:
    path: KITTKit
targets:
  KITT:
    type: application
    platform: iOS
    scheme:
      testTargets: []
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - path: KITT
      - path: TvShared
        includes:
          - TvTheme.swift
          - TvMotion.swift
      - path: KITTtv/Fonts/Orbitron-Bold.ttf
      - path: KITTCar
      - path: Shared
    dependencies:
      - package: KITTKit
      - target: KITTWidgets
    settings:
      base:
        # Device builds: the App Group the widgets read (Config/KITT.entitlements). CarPlay audio needs Apple to approve the entitlement
        # for this App ID; until then it is in the simulator file only (a device build with an unapproved entitlement cannot be signed).
        # After approval, add com.apple.developer.carplay-audio to Config/KITT.entitlements as well.
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": Config/KITTCar.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": Config/KITT.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.tpcl.kitt
        PRODUCT_NAME: KITT
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Kitt
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    info:
      path: KITT/Info.plist
      properties:
        CFBundleDisplayName: Kitt
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        # Siri also answers to "Kit" ("Hey Siri, ask Kit what's on my plate"), the name the first Shortcuts used.
        INAlternativeAppNames:
          - INAlternativeAppName: Kit
            INAlternativeAppNamePronunciationHint: kit
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UIAppFonts:
          - Orbitron-Bold.ttf
        UIBackgroundModes:
          - audio
        # The Lock Screen card (Open · Talk · Brief) is a Live Activity drawn by the KITTWidgets extension.
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: false
        # kitt://open and kitt://talk, from the Lock Screen card.
        CFBundleURLTypes:
          - CFBundleTypeRole: Viewer
            CFBundleURLName: com.tpcl.kitt
            CFBundleURLSchemes:
              - kitt
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneClassName: CPTemplateApplicationScene
                UISceneConfigurationName: KITT CarPlay
                UISceneDelegateClassName: KITTCarSceneDelegate
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: Kitt talks to the hub on your own network.
        NSMicrophoneUsageDescription: Ask Kitt by voice.
        NSSpeechRecognitionUsageDescription: Kitt turns what you say into the command it asks the hub.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSAllowsLocalNetworking: true
  KITTWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - path: KITTWidgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tpcl.kitt.widgets
        PRODUCT_NAME: KITTWidgets
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Kitt
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Config/KITTWidgets.entitlements
        SKIP_INSTALL: YES
    info:
      path: KITTWidgets/Info.plist
      properties:
        CFBundleDisplayName: Kitt
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  KITTMac:
    type: application
    platform: macOS
    scheme:
      testTargets: []
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    deploymentTarget: "15.0"
    sources:
      - path: KITT
        excludes:
          - Info.plist
      - path: TvShared
        includes:
          - TvTheme.swift
          - TvMotion.swift
      - path: KITTtv/Fonts/Orbitron-Bold.ttf
    dependencies:
      - package: KITTKit
    info:
      path: KITTMac/Info.plist
      properties:
        CFBundleDisplayName: Kitt
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        ATSApplicationFontsPath: .
        NSMicrophoneUsageDescription: Ask Kitt by voice.
        NSSpeechRecognitionUsageDescription: Kitt turns what you say into the command it asks the hub.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSAllowsLocalNetworking: true
    entitlements:
      path: KITTMac/KITTMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.device.microphone: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tpcl.kitt.mac
        PRODUCT_NAME: KITT
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Kitt
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
  KITTtv:
    type: application
    platform: tvOS
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    deploymentTarget: "26.0"
    sources:
      - path: KITTtv
      - path: TvShared
      - path: KITT/AppModel.swift
      - path: KITT/KeychainTokenStore.swift
    dependencies:
      - package: KITTKit
    info:
      path: KITTtv/Info.plist
      properties:
        CFBundleDisplayName: Kitt
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIUserInterfaceStyle: Dark
        UILaunchScreen: {}
        UIAppFonts:
          - Orbitron-Bold.ttf
        NSLocalNetworkUsageDescription: Kitt talks to the hub on your own network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tpcl.kitt.tv
        PRODUCT_NAME: KITT
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "3"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Kitt
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - KITTtvUITests
  KITTtvUITests:
    type: bundle.ui-testing
    platform: tvOS
    deploymentTarget: "26.0"
    sources:
      - path: KITTtvUITests
    dependencies:
      - target: KITTtv
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tpcl.kitt.tv.uitests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: KITTtv
  # Mac-only tool: renders the Apple TV screens (TvShared) to PNG so layout can be reviewed without a tvOS simulator.
  KITTtvPreview:
    type: tool
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: TvShared
      - path: TvPreview
    dependencies:
      - package: KITTKit
    settings:
      base:
        PRODUCT_NAME: KITTtvPreview
        SWIFT_VERSION: "6.0"
        CODE_SIGNING_ALLOWED: NO
